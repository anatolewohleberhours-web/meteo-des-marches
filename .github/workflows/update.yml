name: Mise à jour quotidienne des données

# Quand le workflow se déclenche :
on:
  schedule:
    # 21h30 UTC, du lundi au vendredi = ~22h30 heure de Paris (hiver) / ~23h30 (été).
    # C'est après la clôture des marchés américains toute l'année.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # permet aussi de lancer le calcul à la main depuis l'onglet « Actions »

# Autorise le workflow à écrire (commit) dans le dépôt.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Calculer le score et mettre à jour data/data.json
        run: python compute.py

      - name: Publier le JSON mis à jour (s'il a changé)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --staged --quiet; then
            echo "Aucun changement de données aujourd'hui."
          else
            git commit -m "Mise à jour automatique des données ($(date -u +%Y-%m-%d))"
            git push
          fi
